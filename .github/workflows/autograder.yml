name: Autograder CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  grade:
    name: Run Autograding Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run Pytest Autograder
        run: |
          if [ "$GITHUB_REPOSITORY" = "LeonardoDiCaterina/ML_II_Workshops" ]; then
            echo "Template repository detected. Verifying test suite integrity..."
            pytest --collect-only
          else
            echo "Student repository detected. Executing autograder on submission..."
            pytest -v --tb=short
          fi
