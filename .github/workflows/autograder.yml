name: Autograder CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  grade:
    name: Run Autograding Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4\n        with:\n          fetch-depth: 2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run Pytest Autograder & Update Progress Table
        run: |
          if [ "$GITHUB_REPOSITORY" = "LeonardoDiCaterina/ML_II_Workshops" ]; then
            echo "Template repository: verifying tests & initializing progress table..."
            pytest --collect-only
            python scripts/update_grades_table.py --dry-run
          else
            echo "Student repository: evaluating submission & updating grade table..."
            python scripts/update_grades_table.py
          fi

      - name: Commit and Push Updated README & Grade Tracker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md .grades_tracker.json
          git diff --staged --quiet || (git commit -m "chore(autograder): update workshop progress table [skip ci]" && git push)
